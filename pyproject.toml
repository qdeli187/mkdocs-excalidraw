[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-excalidraw"
version = "0.6.1"
description = "Excalidraw drawings in mkdocs"
authors = [
    {name = "qdeli"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "beautifulsoup4 (>=4.13.5,<5.0.0)"
]

[project.urls]
Homepage = "https://github.com/qdeli187/mkdocs-excalidraw"
Documentation = "https://qdeli187.github.io/mkdocs-excalidraw/"
Repository = "https://github.com/qdeli187/mkdocs-excalidraw"
Issues = "https://github.com/qdeli187/mkdocs-excalidraw/issues"
Changelog = "https://github.com/qdeli187/mkdocs-excalidraw/releases"

[project.entry-points."mkdocs.plugins"]
excalidraw = "mkdocs_excalidraw.plugin:ExcalidrawPlugin"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-include-markdown-plugin>=7.2.2",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_excalidraw"]
include = [
    "/mkdocs_excalidraw/assets/excalidraw-renderer.bundle.js",
]

